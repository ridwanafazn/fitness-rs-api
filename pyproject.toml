[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-rs-api"
version = "2.0.0"
description = "Hybrid rule-based + genetic-algorithm fitness recommender API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ridwan Ahmad Fauzan" }]
dependencies = [
  "fastapi>=0.165,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "pygad>=3.9,<4",
  "numpy>=2.5,<3",
  "cloudpickle>=3.1,<4",
  "limits>=5.8,<6",
  "prometheus-fastapi-instrumentator>=8.1,<9",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pyjwt[crypto]>=2.10,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2,<10",
  "pytest-cov>=7.1,<8",
  "httpx2>=2.16,<3",
  "ruff>=0.17,<1",
  "mypy>=2.4,<3",
  "pip-audit>=2.10,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "unit: fast pure-domain tests",
  "integration: API and dataset integration tests",
  "slow: tests that take more than a second",
  "performance: latency / load tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RET"]
# Keep the existing typing style for a focused diff; the runtime is Python 3.11+.
ignore = ["E501", "UP006", "UP035", "UP045", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["app"]
