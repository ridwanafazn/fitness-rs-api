name: CI

on:
  push:
    branches: [main, hardening/production-grade]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: .
      ENVIRONMENT: test
      RATE_LIMIT_ENABLED: "false"
      METRICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Type check
        run: mypy app --show-error-codes
      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fitness-rs-api:ci .
      - name: Smoke test container
        run: |
          docker run -d --name fitness-rs -p 8080:8080 \
            -e ENVIRONMENT=test -e RATE_LIMIT_ENABLED=false \
            -e METRICS_ENABLED=false fitness-rs-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ready
          docker stop fitness-rs
