# Compatibility target only. The free plan sleeps and causes cold starts; see
# docs/hosting.md for always-on deployment options.
services:
  - type: web
    name: fitness-rs-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DOCS_ENABLED
        value: "true"
      - key: METRICS_ENABLED
        value: "true"
      # Temporary migration compatibility: the old API used a wildcard.
      # Replace with the exact frontend origin once it is known.
      - key: CORS_ORIGINS
        value: "*"
      - key: API_KEY
        sync: false
      # P0.1 is disabled until a database and OIDC provider are configured.
      - key: DB_AUTO_CREATE
        value: "false"
      - key: AUTH_ENABLED
        value: "false"
      - key: AUTH_PROFILES_ENABLED
        value: "false"
      - key: PLANS_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT
        value: "120/minute"
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "15"
