repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check app tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: ruff format --check app tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy app
        language: system
        pass_filenames: false
